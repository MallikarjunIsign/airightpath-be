# =====================================================================
# Base configuration (loaded for every profile).
# The active profile (dev/stage/uat/prod) supplies environment specifics
# in application-<profile>.yml.
# =====================================================================
# spring.profiles.active=dev

# Attach the correlation id (set by RequestResponseLoggingFilter) to every log
# line. Renders as:  LEVEL [requestId] ...   (empty [] for non-request logs such
# as application startup).
logging.pattern.level=%5p [%X{requestId:-}]

# =====================================================================
# Upload limits
# =====================================================================
# Here in the base file, not in the per-profile yml, because prod does not load
# those: deployment.yaml starts the app with
#   --spring.config.location=/etc/config/application.properties
# which REPLACES Spring's default config locations, so application-prod.yml is
# never read. The 500MB set there has no effect in the cluster, and prod has
# been falling back to Spring's own defaults of 1MB per file / 10MB per request
# — far below one interview recording, which is hundreds of MB.
#
# An interview's camera and screen recordings are each uploaded as a single
# request when the interview ends, so these bound the whole file, not a chunk.
#
# Sized for the longest interview the timer allows. 60 minutes of shared screen
# at the capped bitrate is ~704 MB (1.5 Mbit video + 64 kbit audio over 3600 s)
# and the camera is ~337 MB. 500MB cut the screen recording off at roughly 42
# minutes, and it failed at the very end of the interview with the whole thing
# already captured and nowhere to put it. 2 GB leaves room for a longer session
# or a higher bitrate and stays well under S3's 5 GB single-PUT ceiling.
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
# Spill to disk immediately rather than buffering in heap. Already the Spring
# default; stated because the value that is wrong here costs a gigabyte of heap
# per concurrent upload.
spring.servlet.multipart.file-size-threshold=0
# Read and discard the body of a rejected upload instead of resetting the
# connection. Tomcat stops reading at 2MB by default, so an oversize recording
# never got its 413 back — the browser saw a reset mid-request and reported a
# CORS failure, which sent the investigation somewhere else entirely.
server.tomcat.max-swallow-size=-1

# =====================================================================
# Interview proctoring
# =====================================================================
# Here as well as in the per-profile yml, because prod is started with
# --spring.config.location pointing at this file and never reads those.
#
# Reaching interview.max-warnings does NOT end the interview; it flags it for
# a person to look at. A candidate who looked away from the camera five times
# was being marked FAILED with PROCTORING_VIOLATION, by a threshold, with no
# further say — and their screen showed the count against a ceiling of 999999
# while the server terminated at five. Set true to restore termination.
interview.terminate-on-max-warnings=false
# The interview length, stated here as well. It was set only in the per-profile
# yml, so prod — which never reads those — was running on the @Value fallback.
# That happened to be the same 60, which is exactly why it would have gone
# unnoticed the day one of them changed.
interview.max-duration-minutes=60
interview.max-warnings=5
