# =====================================================================
# Base configuration (loaded for every profile).
# The active profile (dev/stage/uat/prod) supplies environment specifics
# in application-<profile>.yml.
# =====================================================================
#spring.profiles.active=dev

# Attach the correlation id (set by RequestResponseLoggingFilter) to every log
# line. Renders as:  LEVEL [requestId] ...   (empty [] for non-request logs such
# as application startup).
logging.pattern.level=%5p [%X{requestId:-}]
