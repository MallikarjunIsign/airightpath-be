# =====================================================================
# STAGE profile  (activate with: --spring.profiles.active=stage
#                 or SPRING_PROFILES_ACTIVE=stage)
# Pre-production / integration-testing environment. Modeled on prod but
# with Swagger enabled and SQL logging off. Provide hosts and secrets via
# environment variables; the defaults below are placeholders.
# =====================================================================

server:
  port: 8082
  tomcat:
    connection-timeout: 120s
    keep-alive-timeout: 300s
    max-http-form-post-size: 104857600
    max-http-header-size: 65536
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 10000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/text,text/plain

spring:
  application:
    name: rightpath
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:ai-rightpath-db-dev.cxeq082ue6js.ap-south-1.rds.amazonaws.com}:${MYSQL_PORT:3306}/rightpath_stage?createDatabaseIfNotExist=true&useSSL=true"
    username: ${MYSQL_USER:db-stg-user}
    password: ${MYSQL_PASSWORD:ZkiuxIOCYULiC1oXRkKx}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:rightpath-notifications@isigntech.com}
    password: ${MAIL_PASSWORD:21July@2026}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  websocket:
    session:
      timeout: 0
  mvc:
    async:
      request-timeout: 300000
  config:
    import: "classpath:interview-prompts.properties"

# Password validator
password:
  minsize: 8
  maxsize: 20

# JWT Token
jwt:
  token: "${JWT_TOKEN:2v/++UPDcxJ8awevhoGybYEdWlvmwt1GRr1W/SbvgBVqNXzfdtAh8mtOtCucY5TSneWKF6K8XhKTOC3xwrPpUw==}"

# V2 Auth (Access + Refresh). If secret is empty, falls back to jwt.token.
rightpath:
  security:
    v2:
      jwt:
        secret: ${V2_JWT_SECRET:}
        issuer: arightpath.com
        audience: rightpath-web
        access-ttl-minutes: 10080
        clock-skew-seconds: 60
      refresh:
        ttl-days: 14
        cookie-name: refresh_token
        cookie-secure: false
        cookie-samesite: Lax
        cookie-path: /api

    # First administrator, created at startup when nobody holds SUPER_ADMIN yet.
    # Supply both from the environment — with either left blank the bootstrap
    # logs a warning and skips, rather than standing up a guessable account.
    # Idempotent: it never resets the password of an account already present.
    super-admin:
      enabled: true
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
      first-name: Super
      last-name: Admin
      mobile-number: ${SUPER_ADMIN_MOBILE:0000000000}

# Logging levels (stage = verbose for integration testing)
logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: "OFF"
    org.hibernate.type.descriptor.sql.BasicBinder: "OFF"
    com.rightpath: DEBUG

twilio:
  account:
    sid: ${TWILIO_SID:}
  auth:
    token: ${TWILIO_TOKEN:}
  from:
    number: "whatsapp:+14155238886"

openai:
  api:
    key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
  model: gpt-4o
  audio:
    model: whisper-1
  question:
    timeout-seconds: 180
    generation:
      timeout-seconds: 300
  tts:
    model: tts-1-hd
    voice: nova

# AWS S3 Storage
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:airightpath-interview}
    region: ap-south-1
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    prefix:
      interview: interview
      exam: exam
      proctoring: proctoring

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      enabled: false

app:
  base:
    url: ${APP_BASE_URL:https://devapi.airightpath.com}
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:https://dev.airightpath.com,https://stage.airightpath.com,https://www.airightpath.com,https://airightpath.com,http://localhost:4200,http://localhost:5173}"

  # ── Candidate-facing email branding ────────────────────────────────
  # Every template in EmailServiceImpl reads from here. Held per environment
  # rather than in application.properties because candidate-portal-url has to
  # point at *this* environment's front end: a link mailed from stage that
  # lands on production would send a test candidate into real data.
  #
  # Each key also has a code-side default, so a missing entry degrades to the
  # production wording rather than failing startup — which is exactly why the
  # non-production sender names below are explicit about not being production.

  mail:
    from-name: "${APP_MAIL_FROM_NAME:RightPath Careers (STAGE)}"
    company-name: "${APP_MAIL_COMPANY_NAME:RightPath}"
    # Blank sends replies to spring.mail.username.
    support-email: "${APP_MAIL_SUPPORT_EMAIL:}"
    website: "${APP_MAIL_WEBSITE:https://www.airightpath.com}"
    company-address: "${APP_MAIL_COMPANY_ADDRESS:ISIGN TECH PRIVATE LIMITED, 1st floor, Plot No: 2-87/3, Mn Rd, beside Reliance Trends, Sreeramaaramam, Narsingi, Hyderabad, Telangana 500089}"
    # Target of the "Start my test" / "Go to my dashboard" buttons.
    candidate-portal-url: "${APP_MAIL_CANDIDATE_PORTAL_URL:https://stage.airightpath.com}"
    # Shown on every on-site test mail, so all three quote one address.
    test-venue: "${APP_MAIL_TEST_VENUE:ISIGN TECH PRIVATE LIMITED, 1st floor, Plot No: 2-87/3, Mn Rd, beside Reliance Trends, Sreeramaaramam, Narsingi, Hyderabad, Telangana 500089}"

# Terminal WebSocket Configuration
terminal:
  execution:
    timeout-seconds: 60
  max-sessions-per-user: 3

# ATS Screening Configuration
ats:
  screening:
    threshold: 60.0

# Voice Interview / TTS Configuration
interview:
  max-duration-minutes: 60
  max-warnings: 5
  context-window-size: 4

# Swagger / OpenAPI (enabled in stage for testing)
#   UI: /swagger-ui.html   JSON: /v3/api-docs
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
