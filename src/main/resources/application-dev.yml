# =====================================================================
# DEV profile (default; activate with --spring.profiles.active=dev)
# Local development against a local MySQL. Verbose logging, Swagger on.
# =====================================================================

server:
  port: 8082
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 104857600
    max-http-header-size: 65536
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/text,text/plain

spring:
  application:
    name: rightpath
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/Rightpath?createDatabaseIfNotExist=true"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:Mahesh.konamoni@isigntech.com}
    password: ${MAIL_PASSWORD:Mahesh1234@}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  websocket:
    session:
      timeout: 0
  config:
    import: "classpath:interview-prompts.properties"

# Password validator
password:
  minsize: 8
  maxsize: 20

# JWT Token
jwt:
  token: "2v/++UPDcxJ8awevhoGybYEdWlvmwt1GRr1W/SbvgBVqNXzfdtAh8mtOtCucY5TSneWKF6K8XhKTOC3xwrPpUw=="

# V2 Auth (Access + Refresh). If secret is empty, falls back to jwt.token.
rightpath:
  security:
    v2:
      jwt:
        # secret: test-jwt-secret-key-for-local-development-only
        issuer: arightpath.com
        audience: rightpath-web
        access-ttl-minutes: 10
        clock-skew-seconds: 60
      refresh:
        ttl-days: 14
        cookie-name: refresh_token
        cookie-secure: false
        cookie-samesite: Lax
        cookie-path: /api

# Logging levels (dev = verbose).
#   com.rightpath=DEBUG shows the access log's inbound line + all app debug.
#   Flip org.springframework.security to DEBUG for the "Securing ..." trace.
logging:
  level:
    com.rightpath: DEBUG
    org.springframework.security: INFO

twilio:
  account:
    sid: ${TWILIO_SID:TEST_TWILIO_SID}
  auth:
    token: ${TWILIO_TOKEN:TEST_TWILIO_SID}
  from:
    number: "whatsapp:+14155238886"

openai:
  api:
    key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
  model: gpt-4o
  audio:
    model: whisper-1
  question:
    timeout-seconds: 300
  tts:
    model: tts-1-hd
    voice: nova

# AWS S3 Storage
aws:
  s3:
    bucket-name: airightpath-interview
    region: ap-south-1
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    prefix:
      interview: interview
      exam: exam

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      enabled: false

app:
  base:
    url: http://localhost:8082
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:5173,http://192.168.1.8:5173,https://www.airightpath.com,https://dev.airightpath.com"

# Terminal WebSocket Configuration
terminal:
  execution:
    timeout-seconds: 120
  max-sessions-per-user: 5

# ATS Screening Configuration
ats:
  screening:
    threshold: 60.0

# Voice Interview / TTS Configuration + early termination tuning
interview:
  max-duration-minutes: 60
  max-warnings: 5
  context-window-size: 4
  early-termination:
    min-questions: 4
    skip-ratio-threshold: 0.5
    min-avg-word-count: 15
    min-confidence-score: 30.0
    consecutive-skip-threshold: 2
    consecutive-short-answer-threshold: 3

questions:
  additional:
    count: 100

# Swagger / OpenAPI (dev)
#   UI: http://localhost:8082/swagger-ui.html   JSON: /v3/api-docs
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
