spring.config.import=classpath:interview-prompts.properties


# application.properties
management.endpoint.health.enabled=false

spring.websocket.session.timeout=0

# Terminal WebSocket Configuration
terminal.execution.timeout-seconds=120
terminal.max-sessions-per-user=5

# ATS Screening Configuration
ats.screening.threshold=60.0

# Voice Interview / TTS Configuration
openai.tts.model=tts-1-hd
openai.tts.voice=nova
interview.max-duration-minutes=60
interview.max-warnings=5
interview.context-window-size=4

# Early termination for poor performance
interview.early-termination.min-questions=4
interview.early-termination.skip-ratio-threshold=0.5
interview.early-termination.min-avg-word-count=15
interview.early-termination.min-confidence-score=30.0
interview.early-termination.consecutive-skip-threshold=2
interview.early-termination.consecutive-short-answer-threshold=3
# Tomcat Configuration
